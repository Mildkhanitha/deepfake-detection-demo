<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deepfake Detection Demo</title><style>html,body{margin:0;background:#101725;color:#fff;font-family:system-ui,sans-serif;height:100%}#s{height:100%;display:grid;place-items:center;text-align:center;padding:24px}.muted{opacity:.65;font-size:14px}</style></head><body><div id="s"><div><div>Loading Deepfake Detection Demo…</div><div class="muted">Please wait a moment</div></div></div><script>(async()=>{try{let b64='';for(let i=0;i<27;i++){const n=String(i).padStart(2,'0');const r=await fetch('chunks/s'+n+'.txt');if(!r.ok)throw new Error('Missing part '+n);b64+=(await r.text()).trim()}const bin=atob(b64);const gz=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)gz[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const w=ds.writable.getWriter();w.write(gz);w.close();const reader=ds.readable.getReader();const out=[];let total=0;while(true){const {done,value}=await reader.read();if(done)break;out.push(value);total+=value.length}const bytes=new Uint8Array(total);let o=0;for(const p of out){bytes.set(p,o);o+=p.length}const html=new TextDecoder().decode(bytes);document.open();document.write(html);document.close()}catch(e){document.getElementById('s').innerHTML='<div><b>Demo failed to load</b><div class="muted">'+String(e.message||e)+'</div></div>'}})();</script></body></html>
