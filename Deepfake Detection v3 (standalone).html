1px/1.2 var(--mono);color:var(--mut)}\n.scs{display:flex;flex-wrap:wrap;gap:4px}\n.sc{display:inline-flex;align-items:center;gap:4px;font:500 10.5px/1.2 var(--mono);padding:3px 6px;border-radius:5px;white-space:nowrap}\n.sc.lv-low{background:#eef2f8;color:#3c5680}.sc.lv-mid{background:#fcf1dd;color:#8a5a00}.sc.lv-high{background:var(--bad-l);color:var(--bad)}.sc.x{background:#f1f2f5;color:#7b8595}\n.face{display:flex;gap:12px;align-items:center}\n.face .crop{width:56px}\n.qbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#eef0f4}\n.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;line-height:1.5;padding:7px 0;border-bottom:1px solid var(--line2)}\n.kv:last-child{border-bottom:0}\n.kv span:first-child{color:var(--mut);flex:none}\n.kv span:last-child{text-align:right;font-weight:500;overflow-wrap:anywhere;min-width:0}\n.reason{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line2)}\n.reason-n{flex:none;min-width:44px;height:26px;padding:0 6px;border-radius:7px;background:#fff;border:1px solid var(--neu-b);font:600 12px/24px var(--mono);text-align:center;color:var(--ink2)}\n\n/* ---------- lightbox ---------- */\n.lb{position:fixed;inset:0;z-index:60;background:rgba(8,11,16,.84);display:flex;align-items:center;justify-content:center;padding:24px;animation:dfin .15s ease-out}\n.lb-box{background:#0f1622;color:#e8ecf3;border-radius:14px;overflow:hidden;width:min(1080px,100%);max-height:calc(100vh - 48px);display:grid;grid-template-columns:minmax(0,1fr) 300px;box-shadow:0 20px 60px rgba(0,0,0,.4)}\n.lb-main{position:relative;display:flex;align-items:center;background:#000;min-width:0}\n.lb-main .frame{width:100%}\n.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#0f1622;font-size:22px;line-height:1;display:grid;place-items:center}\n.lb-nav:hover{background:#fff}\n.lb-side{padding:18px;displ 50%;pointer-events:none}\n.area{position:absolute;inset:8px;pointer-events:none;border:2px solid rgba(56,189,248,.55);border-radius:10px}\n.rt-verdict{border-radius:12px;border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:8px;background:#fff}\n.rt-verdict.k-real{background:#f0f9f4;border-color:var(--ok-b)}\n.rt-verdict.k-fake{background:var(--bad-l);border-color:var(--bad-b)}\n.rt-verdict.k-unable{background:var(--neu-l);border-color:var(--neu-b)}\n.rt-v{font-size:18px;font-weight:700;line-height:1.35}\n.rt-state{display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:1.5;color:var(--ink2)}\n.lb-look{border-radius:10px;background:rgba(255,107,94,.1);border:1px solid rgba(255,107,94,.28);padding:10px 12px;display:flex;flex-direction:column;gap:6px}\n.lb-look .ul li{color:#e8ecf3;font-size:12.5px}\n.lb-look .ul li::before{background:#ff8f84}\n.k-real .rt-v{color:var(--ok)}.k-fake .rt-v{color:var(--bad)}.k-unable .rt-v{color:var(--ink2)}.k-none .rt-v{color:var(--mut)}\n.chips{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}\n.chips i{height:18px;border-radius:3px;background:#eef0f4}\n.chips i.real{background:#5fb58f}.chips i.fake{background:#d6453a}.chips i.unable{background:#aab2bf}\n.log{display:flex;flex-direction:column}\n.log li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12.5px}\n.log li:last-child{border-bottom:0}\n\n/* ---------- dev panel ---------- */\n.dev{position:fixed;right:16px;bottom:16px;z-index:70;width:320px;max-height:calc(100vh - 32px);overflow:auto;background:#fffdf5;border:1px solid #e3cf95;border-radius:12px;box-shadow:0 12px 40px rgba(16,24,40,.22);padding:14px;display:flex;flex-direction:column;gap:12px;font-size:12.5px}\n.dev-h{font:600 11px/1.2 var(--mono);color:#8a5a00;letter-spacing:.05em}\n.seg{display:flex;flex-wrap:wrap;gap:4px}\n.seg button{border:1px solid #e3d7b5;background:#fff;border-radius:6px;padding:5px 8px;font-size:12px;line-height:1.2;color:var(--ink2)}\n.seg button[aria-pressed=true]{background:#0f1622;border-color:#0f1622;color:#fff}\n.assets{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font:400 11px/1.5 var(--mono);color:var(--ink2)}\n\n/* ---------- responsive (container = app width, so DEV mobile preview behaves like a phone) ---------- */\n@container (max-width:1023px){\n  .layout{grid-template-columns:minmax(0,1fr)}\n  .how{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}\n}\n@container (max-width:860px){\n  .modes{grid-template-columns:minmax(0,1fr)}\n  .mode{flex-direction:row;align-items:flex-start;gap:14px;padding:18px}\n  .mode .mode-go{display:none}\n  .mode-tag{display:none}\n  .samples{grid-template-columns:repeat(2,minmax(0,1fr))}\n}\n@media (max-width:860px){\n  .lb-box{grid-template-columns:minmax(0,1fr)}\n  .lb-side{border-left:0;border-top:1px solid rgba(255,255,255,.08);max-height:42vh}\n}\n@container (max-width:639px){\n  .hdr-in{padding:8px 16px}\n  .brand-s{display:none}\n  .nav{order:3;width:100%}\n  .nav button{flex:1;padding:8px 4px;font-size:12.5px}\n  .main{padding:20px 16px 40px}\n  .foot-in{padding:12px 16px}\n  .card{padding:16px}\n  .h1{font-size:23px}\n  .lead{font-size:14px}\n  .two,.outs,.how,.srcs{grid-template-columns:minmax(0,1fr)}\n  .meta{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .frames{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .verdict{padding:18px 16px}\n  .v-top{flex-direction:column;gap:12px}\n  .v-title{font-size:21px}\n  .conf{width:100%}\n  .dz{padding:26px 16px}\n  .btn-block-sm{width:100%}\n  .tl-row,.tl-axis{grid-template-columns:44px minmax(0,1fr);gap:6px}\n  .tl-bars{gap:1px;height:44px}\n  .chips{grid-template-columns:repeat(8,minmax(0,1fr))}\n  .src{padding:18px}\n}\n@container (min-width:640px) and (max-width:1023px){\n  .conf{width:200px}\n}\n@media (max-width:640px){\n  .lb{padding:0;align-items:stretch}\n  .lb-box{border-radius:0;max-height:100vh;width:100%;align-content:start;overflow:auto}\n  .lb-side{max-height:none;overflow:visible}\n  .dev{left:8px;right:8px;width:auto;bottom:8px}\n}\n<\/style>\n<\/helmet>\n\n<div class=\"{{ rootClass }}\">\n<div class=\"app\">\n\n  <header class=\"hdr\">\n    <div class=\"hdr-in\">\n      <button class=\"brand\" sc-camel-on-click=\"{{ goHome }}\" aria-label=\"Deepfake Video Detection — กลับหน้าหลัก\">\n        <span class=\"brand-mark\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3\"><\/path><circle cx=\"12\" cy=\"11\" r=\"3\"><\/circle><path d=\"M7.5 17.5c1-1.8 2.6-2.7 4.5-2.7s3.5.9 4.5 2.7\"><\/path><\/svg>\n        <\/span>\n        <span>\n          <span class=\"brand-t\">Deepfake Video Detection<\/span>\n          <span class=\"brand-s\">SEQUENTIAL FRAME ANALYSIS · PROTOTYPE<\/span>\n        <\/span>\n      <\/button>\n      <div class=\"hdr-sp\"><\/div>\n      <nav class=\"nav\" aria-label=\"เมนูหลัก\">\n        <button aria-current=\"{{ navHome }}\" sc-camel-on-click=\"{{ goHome }}\">หน้าหลัก<\/button>\n        <button aria-current=\"{{ navUpload }}\" sc-camel-on-click=\"{{ goUpload }}\">อัปโหลดวิดีโอ<\/button>\n        <button aria-current=\"{{ navRt }}\" sc-camel-on-click=\"{{ goRealtime }}\">Near Real-time<\/button>\n      <\/nav>\n    <\/div>\n  <\/header>\n\n  <main class=\"main\">\n\n    <!-- ================= HOME ================= -->\n    <sc-if value=\"{{ isHome }}\">\n      <div class=\"stack g28 fade\">\n        <section class=\"stack g10\">\n          <div class=\"eyebrow\">Deepfake Video Detection<\/div>\n          <h1 class=\"h1\">ตรวจสอบว่าวิดีโอมีแนวโน้มเป็น Deepfake หรือไม่<\/h1>\n          <p class=\"lead\">ระบบวิเคราะห์ภาพใบหน้าจากหลายเฟรมตามลำดับเวลา แล้วสรุปผลเป็นการประเมินระดับวิดีโอ ผลลัพธ์เป็นการประเมินเบื้องต้นจากแบบจำลอง ไม่ใช่การยืนยันความแท้ของวิดีโอ<\/p>\n        <\/section>\n\n        <section class=\"stack g12\">\n          <h2 class=\"sec-t\">เลือกวิธีตรวจสอบ<\/h2>\n          <div class=\"modes\">\n            <button class=\"mode mode-pri\" sc-camel-on-click=\"{{ goUpload }}\">\n              <div class=\"row between g8\">\n                <div class=\"mode-ic\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 15V4M7.5 8.5 12 4l4.5 4.5\"><\/path><path d=\"M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3\"><\/path><\/svg><\/div>\n                <span class=\"pill mode-tag\" style=\"color:#1f5fd8;background:#e9effc\">แนะนำ<\/span>\n              <\/div>\n              <div>\n                <div class=\"mode-t\">อัปโหลดไฟล์วิดีโอ<\/div>\n                <div class=\"mode-d\">ตรวจสอบวิดีโอที่บันทึกไว้แล้ว พร้อมรายงานผลและเฟรมประกอบ<\/div>\n              <\/div>\n              <div class=\"mode-go\">เริ่มอัปโหลด →<\/div>\n            <\/button>\n            <button class=\"mode\" sc-camel-on-click=\"{{ openWebcam }}\">\n              <div class=\"mode-ic\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"6\" width=\"13\" height=\"12\" rx=\"2\"><\/rect><path d=\"m16 10 5-3v10l-5-3\"><\/path><\/svg><\/div>\n              <div>\n                <div class=\"mode-t\">กล้อง Webcam<\/div>\n                <div class=\"mode-d\">วิเคราะห์ภาพจากกล้องแบบใกล้เวลาจริง ผลอัปเดตเป็นช่วง ๆ<\/div>\n              <\/div>\n              <div class=\"mode-go\">เปิดกล้อง →<\/div>\n            <\/button>\n            <button class=\"mode\" sc-camel-on-click=\"{{ openScreen }}\">\n              <div class=\"mode-ic\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"2\"><\/rect><path d=\"M8 20h8M12 16v4\"><\/path><\/svg><\/div>\n              <div>\n                <div class=\"mode-t\">แชร์หน้าจอ / หน้าต่างวิดีโอ<\/div>\n                <div class=\"mode-d\">วิเคราะห์ภาพวิดีโอคอลหรือวิดีโอที่กำลังเล่นบนหน้าจอ<\/div>\n              <\/div>\n              <div class=\"mode-go\">เลือกหน้าจอ →<\/div>\n            <\/button>\n          <\/div>\n        <\/section>\n\n        <section class=\"card stack g16\">\n          <h2 class=\"sec-t\">ระบบทำงานอย่างไร<\/h2>\n          <ol class=\"how\">\n            <sc-for list=\"{{ howSteps }}\" as=\"h\">\n              <li class=\"row start g12\">\n                <span class=\"how-n\">{{ h.n }}<\/span>\n                <div>\n                  <div style=\"font-size:13.5px;font-weight:600;line-height:1.4\">{{ h.t }}<\/div>\n                  <div class=\"small\" style=\"margin-top:2px\">{{ h.d }}<\/div>\n                <\/div>\n              <\/li>\n            <\/sc-for>\n          <\/ol>\n        <\/section>\n\n        <section class=\"card stack g12\">\n          <h2 class=\"sec-t\">ผลลัพธ์ที่ระบบอาจให้<\/h2>\n          <div class=\"outs\">\n            <div class=\"out out-real\"><div class=\"out-t\"><span class=\"dot\" style=\"background:#0f8a5f\"><\/span>มีแนวโน้มเป็นวิดีโอจริง<\/div><div class=\"small\">ไม่พบลักษณะที่บ่งชี้ Deepfake อย่างเด่นชัดในเฟรมที่วิเคราะห์<\/div><\/div>\n            <div class=\"out out-fake\"><div class=\"out-t\"><span class=\"dot\" style=\"background:#c2352b\"><\/span>มีแนวโน้มเป็นวิดีโอ Deepfake<\/div><div class=\"small\">พบลักษณะที่บ่งชี้ Deepfake พร้อมช่วงเวลาที่ควรตรวจดูเพิ่มเติม<\/div><\/div>\n            <div class=\"out out-unable\"><div class=\"out-t\"><span class=\"dot\" style=\"background:#7b8595\"><\/span>ไม่สามารถวิเคราะห์ได้<\/div><div class=\"small\">ภาพใบหน้าไม่เพียงพอ เช่น ไม่พบใบหน้า ภาพเบลอ หรือแสงน้อย<\/div><\/div>\n          <\/div>\n        <\/section>\n\n        <div class=\"two\">\n          <section class=\"card stack g10\">\n            <h2 class=\"sec-t\" style=\"color:#0f8a5f\">สิ่งที่ระบบวิเคราะห์<\/h2>\n            <ul class=\"ul\">\n              <li>ข้อมูลภาพบริเวณใบหน้าจากหลายเฟรมตามลำดับเวลา<\/li>\n              <li>ทุกใบหน้าที่ตรวจพบในวิดีโอ<\/li>\n              <li>คุณภาพภาพใบหน้าก่อนนำเข้าแบบจำลอง<\/li>\n            <\/ul>\n          <\/section>\n          <section class=\"card stack g10\">\n            <h2 class=\"sec-t\" style=\"color:#5b6576\">สิ่งที่ระบบไม่ได้วิเคราะห์<\/h2>\n            <ul class=\"ul\">\n              <li>เสียงหรือเนื้อหาคำพูด<\/li>\n              <li>การยืนยันตัวตนของบุคคลในวิดีโอ<\/li>\n              <li>การระบุว่าบุคคลในวิดีโอเป็นมิจฉาชีพ<\/li>\n            <\/ul>\n          <\/section>\n        <\/div>\n        <p class=\"small\">วิดีโอและภาพจากกล้องหรือหน้าจอใช้เพื่อการวิเคราะห์เท่านั้น ข้อมูลชั่วคราวจะถูกลบหลังประมวลผล และไม่ถูกจัดเก็บถาวร<\/p>\n      <\/div>\n    <\/sc-if>\n\n    <!-- ================= UPLOAD · SELECT ================= -->\n    <sc-if value=\"{{ isUploadIdle }}\">\n      <div class=\"stack g20 fade\">\n        <div class=\"stack g8\">\n          <h1 class=\"h1\">อัปโหลดวิดีโอเพื่อตรวจสอบ<\/h1>\n          <p class=\"lead\">เลือกไฟล์จากเครื่องของคุณ หรือใช้วิดีโอตัวอย่างสำหรับการทดสอบด้านล่าง<\/p>\n        <\/div>\n        <input type=\"file\" class=\"sr\" accept=\"{{ acceptTypes }}\" ref=\"{{ fileRef }}\" sc-camel-on-change=\"{{ onFileChange }}\" sc-camel-tab-index=\"-1\" aria-hidden=\"true\">\n        <div class=\"layout\">\n          <div class=\"stack g16 minw0\">\n            <sc-if value=\"{{ uploadError }}\">\n              <div class=\"alert alert-warn\" role=\"alert\">\n                <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex:none;margin-top:2px\"><path d=\"M12 9v4M12 17h.01\"><\/path><path d=\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"><\/path><\/svg>\n                <div class=\"grow\"><b>ไม่สามารถใช้ไฟล์นี้ได้<\/b><div>{{ uploadError }}<\/div><\/div>\n                <button class=\"btn btn-ghost btn-sm\" sc-camel-on-click=\"{{ dismissError }}\">ปิด<\/button>\n              <\/div>\n            <\/sc-if>\n\n            <sc-if value=\"{{ noSelection }}\">\n              <div class=\"{{ dzClass }}\" role=\"button\" sc-camel-tab-index=\"0\" aria-label=\"เลือกไฟล์วิดีโอจากเครื่อง\" sc-camel-on-click=\"{{ pickFile }}\" sc-camel-on-key-down=\"{{ dzKey }}\" sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-drag-leave=\"{{ onDragLeave }}\" sc-camel-on-drop=\"{{ onDrop }}\">\n                <div class=\"dz-ic\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 15V4M7.5 8.5 12 4l4.5 4.5\"><\/path><path d=\"M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3\"><\/path><\/svg><\/div>\n                <div style=\"font-size:16px;font-weight:600\">ลากไฟล์วิดีโอมาวางที่นี่<\/div>\n                <div class=\"small\">หรือ<\/div>\n                <span class=\"btn btn-sec\" aria-hidden=\"true\">เลือกไฟล์จากเครื่อง<\/span>\n                <div class=\"tiny\" style=\"margin-top:4px\">MP4, MOV, AVI, MKV, WebM · ขนาดไม่เกิน 200 MB · ความยาวไม่เกิน 3 นาที<\/div>\n              <\/div>\n\n              <section class=\"stack g12\">\n                <div class=\"row between g8 wrap\">\n                  <h2 class=\"sec-t\">วิดีโอตัวอย่างสำหรับการทดสอบ<\/h2>\n                  <span class=\"tiny\">คลิกเพื่อเลือก<\/span>\n                <\/div>\n                <div class=\"samples\">\n                  <sc-for list=\"{{ samples }}\" as=\"s\">\n                    <button class=\"sample\" sc-camel-on-click=\"{{ s.pick }}\" aria-label=\"{{ s.aria }}\">\n                      <div class=\"frame sm\">\n                        <img sc-camel-src=\"{{ s.img }}\" alt=\"\">\n                        <span class=\"chip-dark\" style=\"right:6px;bottom:6px\">{{ s.durLabel }}<\/span>\n                      <\/div>\n                      <div class=\"sample-b\">\n                        <div class=\"sample-n\">{{ s.name }}<\/div>\n                        <div class=\"tiny\">{{ s.note }}<\/div>\n                      <\/div>\n                    <\/button>\n                  <\/sc-for>\n                <\/div>\n              <\/section>\n            <\/sc-if>\n\n            <sc-if value=\"{{ hasSelection }}\">\n              <section class=\"card p0\">\n                <div class=\"player\">\n                  <sc-if value=\"{{ isUserFile }}\">\n                    <sc-if value=\"{{ userPreviewOk }}\">\n                      <video sc-camel-src=\"{{ fileUrl }}\" controls=\"{{ true }}\" preload=\"metadata\" sc-camel-plays-inline=\"{{ true }}\" sc-camel-on-error=\"{{ onVidErr }}\"><\/video>\n                    <\/sc-if>\n                    <sc-if value=\"{{ userPreviewErr }}\">\n                      <div class=\"frame\" style=\"display:grid;place-items:center;color:#c9d1de;text-align:center;padding:20px\">\n                        <div class=\"stack g6\" style=\"position:relative;max-width:360px\">\n                          <div style=\"font-weight:600;color:#fff\">ไม่สามารถแสดงตัวอย่างวิดีโอนี้ในเบราว์เซอร์ได้<\/div>\n                          <div class=\"small\" style=\"color:#aab4c4\">รูปแบบไฟล์อาจไม่รองรับการเล่นในเบราว์เซอร์ แต่ยังสามารถส่งวิเคราะห์ได้<\/div>\n                        <\/div>\n                      <\/div>\n                    <\/sc-if>\n                  <\/sc-if>\n                  <sc-if value=\"{{ isSample }}\">\n                    <div class=\"frame\">\n                      <div class=\"{{ pvMovClass }}\"><img sc-camel-src=\"{{ pvImg }}\" alt=\"ภาพตัวอย่างจากวิดีโอ {{ cur.name }}\"><\/div>\n                    <\/div>\n                    <div class=\"pbar\">\n                      <button class=\"pbtn\" sc-camel-on-click=\"{{ togglePreview }}\" aria-label=\"{{ pvPlayLabel }}\">\n                        <sc-if value=\"{{ !pvPlaying }}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M7 4.5v15l13-7.5z\"><\/path><\/svg><\/sc-if>\n                        <sc-if value=\"{{ pvPlaying }}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><rect x=\"6\" y=\"4.5\" width=\"4\" height=\"15\" rx=\"1\"><\/rect><rect x=\"14\" y=\"4.5\" width=\"4\" height=\"15\" rx=\"1\"><\/rect><\/svg><\/sc-if>\n                      <\/button>\n                      <div class=\"ptrack\" sc-camel-on-click=\"{{ seekPreview }}\" role=\"presentation\"><i style=\"{{ pvBar }}\"><\/i><\/div>\n                      <span class=\"mono\" style=\"font-size:12px;white-space:nowrap\">{{ pvTime }} / {{ cur.durLabel }}<\/span>\n                    <\/div>\n                  <\/sc-if>\n                <\/div>\n                <div class=\"stack g16\" style=\"padding:18px 20px\">\n                  <div class=\"row g12 start\">\n                    <div class=\"frame sm none\" style=\"width:84px;border-radius:7px\">\n                      <sc-if value=\"{{ selThumb }}\"><img sc-camel-src=\"{{ selThumb }}\" alt=\"\"><\/sc-if>\n                    <\/div>\n                    <div class=\"grow stack g4\">\n                      <div class=\"mono\" style=\"font-size:13.5px;font-weight:500;overflow-wrap:anywhere;line-height:1.45\">{{ cur.name }}<\/div>\n                      <div class=\"row g6 wrap\"><span class=\"pill pill-ok\">✓ พร้อมสำหรับการวิเคราะห์<\/span><\/div>\n                    <\/div>\n                  <\/div>\n                  <dl class=\"meta\">\n                    <div><dt>รูปแบบไฟล์<\/dt><dd>{{ cur.fmt }}<\/dd><\/div>\n                    <div><dt>ความยาว<\/dt><dd>{{ cur.durLabel }}<\/dd><\/div>\n                    <div><dt>ขนาดไฟล์<\/dt><dd>{{ cur.size }}<\/dd><\/div>\n                    <div><dt>ความละเอียด<\/dt><dd>{{ cur.res }}<\/dd><\/div>\n                  <\/dl>\n                  <div class=\"row g8 wrap\">\n                    <button class=\"btn btn-sec btn-sm\" sc-camel-on-click=\"{{ pickFile }}\">เปลี่ยนวิดีโอ<\/button>\n                    <button class=\"btn btn-ghost btn-sm\" sc-camel-on-click=\"{{ clearSel }}\">นำวิดีโอออก<\/button>\n                  <\/div>\n                <\/div>\n              <\/section>\n\n              <section class=\"card stack g12\">\n                <h2 class=\"sec-t\">การใช้ข้อมูลวิดีโอ<\/h2>\n                <p class=\"txt\">วิดีโอจะถูกใช้เพื่อการวิเคราะห์ Deepfake เท่านั้น ระบบวิเคราะห์เฉพาะภาพใบหน้า ไม่วิเคราะห์เสียง ข้อมูลที่จัดเก็บชั่วคราวจะถูกลบหลังประมวลผลเสร็จ หรือตามระยะเวลาที่ระบบกำหนด ระบบไม่เก็บประวัติการอัปโหลดถาวร<\/p>\n                <label class=\"{{ consentClass }}\" for=\"df-consent\">\n                  <input type=\"checkbox\" id=\"df-consent\" checked=\"{{ consent }}\" sc-camel-on-change=\"{{ toggleConsent }}\">\n                  <span style=\"font-size:13.5px;line-height:1.6;font-weight:500\">ฉันรับทราบและยอมรับเงื่อนไขการใช้ข้อมูลข้างต้น<\/span>\n                <\/label>\n                <div class=\"row g12 wrap\">\n                  <button class=\"btn btn-pri btn-lg btn-block-sm\" disabled=\"{{ !consent }}\" sc-camel-on-click=\"{{ startAnalysis }}\">เริ่มวิเคราะห์วิดีโอ<\/button>\n                  <span class=\"small\">{{ startHint }}<\/span>\n                <\/div>\n              <\/section>\n            <\/sc-if>\n          <\/div>\n\n          <aside class=\"aside\">\n            <section class=\"card stack g12\">\n              <h2 class=\"sec-t\">เพื่อผลการวิเคราะห์ที่ดี<\/h2>\n              <div class=\"stack g8\">\n                <sc-for list=\"{{ tips }}\" as=\"t\"><div class=\"tick\"><b>✓<\/b><span>{{ t }}<\/span><\/div><\/sc-for>\n              <\/div>\n            <\/section>\n            <section class=\"card stack g8\">\n              <h2 class=\"sec-t\">ข้อควรทราบ<\/h2>\n              <p class=\"small\">ระบบวิเคราะห์เฉพาะข้อมูลทางภาพบริเวณใบหน้า ไม่วิเคราะห์เสียงหรือเนื้อหาคำพูด และไม่ใช้สำหรับการยืนยันตัวตนหรือการระบุว่าบุคคลเป็นมิจฉาชีพ<\/p>\n            <\/section>\n          <\/aside>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n\n    <!-- ================= UPLOAD · PROCESSING ================= -->\n    <sc-if value=\"{{ isAnalyzing }}\">\n      <div class=\"layout fade\">\n        <section class=\"card stack g20\">\n          <div class=\"row between start g12 wrap\">\n            <div class=\"stack g4 minw0\">\n              <div class=\"eyebrow\">กำลังวิเคราะห์วิดีโอ<\/div>\n              <h1 class=\"h2 mono\" style=\"font-size:16px;overflow-wrap:anywhere\">{{ cur.name }}<\/h1>\n            <\/div>\n            <div class=\"pct\" aria-hidden=\"true\">{{ pctLabel }}<\/div>\n          <\/div>\n          <div class=\"stack g8\">\n            <div class=\"bar\" role=\"progressbar\" aria-label=\"ความคืบหน้าการวิเคราะห์\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"{{ pctNum }}\"><i style=\"{{ barStyle }}\"><\/i><\/div>\n            <div class=\"row between g8 wrap small\"><span>{{ stepNow }}<\/span><span>{{ etaLabel }}<\/span><\/div>\n          <\/div>\n          <ol class=\"steps\" aria-live=\"polite\">\n            <sc-for list=\"{{ steps }}\" as=\"s\">\n              <li class=\"{{ s.cls }}\">\n                <span class=\"step-d\">\n                  <sc-if value=\"{{ s.active }}\"><span class=\"spin\" style=\"width:12px;height:12px;border-width:2px\"><\/span><\/sc-if>\n                  <sc-if value=\"{{ !s.active }}\">{{ s.mark }}<\/sc-if>\n                <\/span>\n                <div class=\"grow\">\n                  <div class=\"step-t\">{{ s.t }}<\/div>\n                  <sc-if value=\"{{ s.note }}\"><div class=\"step-n\">{{ s.note }}<\/div><\/sc-if>\n                <\/div>\n              <\/li>\n            <\/sc-for>\n          <\/ol>\n          <div class=\"divider\"><\/div>\n          <div class=\"row between g12 wrap\">\n            <span class=\"small\">หากยกเลิก ระบบจะลบข้อมูลที่ประมวลผลไปแล้ว<\/span>\n            <button class=\"btn btn-danger btn-sm\" sc-camel-on-click=\"{{ cancelAnalysis }}\">ยกเลิกการวิเคราะห์<\/button>\n          <\/div>\n        <\/section>\n        <aside class=\"aside\">\n          <section class=\"card p0\">\n            <div class=\"frame\">\n              <sc-if value=\"{{ pvUser }}\"><video sc-camel-src=\"{{ fileUrl }}\" preload=\"auto\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\"><\/video><\/sc-if>\n              <sc-if value=\"{{ anImg }}\"><img sc-camel-src=\"{{ anImg }}\" alt=\"เฟรมที่กำลังประมวลผล\"><\/sc-if>\n              <sc-for list=\"{{ anBoxes }}\" as=\"b\"><div class=\"{{ b.cls }}\" style=\"{{ b.style }}\"><span class=\"fbox-l\">{{ b.label }}<\/span><\/div><\/sc-for>\n              <sc-if value=\"{{ anSweep }}\"><div class=\"sweep\"><\/div><\/sc-if>\n              <span class=\"chip-dark\" style=\"left:8px;bottom:8px\">{{ anChip }}<\/span>\n            <\/div>\n            <div class=\"stack g4\" style=\"padding:12px 14px\">\n              <div style=\"font-size:13px;font-weight:600\">{{ anCaption }}<\/div>\n              <div class=\"tiny\">เฟรมตัวอย่างจากวิดีโอที่กำลังประมวลผล<\/div>\n            <\/div>\n          <\/section>\n          <section class=\"card stack g10\">\n            <h2 class=\"sec-t\">ใบหน้าที่ตรวจพบ<\/h2>\n            <sc-if value=\"{{ anFacesPending }}\"><div class=\"row g8 small\"><span class=\"spin\" style=\"color:#1f5fd8\"><\/span>กำลังค้นหาใบหน้าในวิดีโอ…<\/div><\/sc-if>\n            <sc-if value=\"{{ anFacesNone }}\"><div class=\"small\">ยังไม่พบใบหน้าในเฟรมที่ตรวจ<\/div><\/sc-if>\n            <sc-for list=\"{{ anFaces }}\" as=\"f\">\n              <div class=\"face fade\">\n                <div class=\"crop\" style=\"width:44px\"><img sc-camel-src=\"{{ f.img }}\" alt=\"\" style=\"{{ f.imgStyle }}\"><\/div>\n                <div class=\"stack\"><span style=\"font-size:13px;font-weight:600\">{{ f.name }}<\/span><span class=\"tiny\">{{ f.sub }}<\/span><\/div>\n              <\/div>\n            <\/sc-for>\n          <\/section>\n        <\/aside>\n      <\/div>\n    <\/sc-if>\n\n    <!-- ================= UPLOAD · RESULT ================= -->\n    <sc-if value=\"{{ isResult }}\">\n      <div class=\"stack g16 fade\">\n        <div class=\"row between g12 wrap\">\n          <button class=\"btn btn-sec btn-sm\" sc-camel-on-click=\"{{ newVideo }}\">← เลือกวิดีโอใหม่<\/button>\n          <div class=\"row g8 wrap minw0\">\n            <span class=\"mono small\" style=\"overflow-wrap:anywhere\">{{ cur.name }}<\/span>\n            <span class=\"pill pill-demo\" title=\"ผลลัพธ์ในต้นแบบนี้เป็นข้อมูลจำลอง ไม่ได้มาจากแบบจำลองจริง\">ผลลัพธ์จำลองสำหรับทดสอบต้นแบบ<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"layout\">\n          <div class=\"stack g16 minw0\">\n            <!-- 1–2: result + confidence -->\n            <section class=\"{{ vClass }}\" aria-live=\"polite\">\n              <div class=\"v-top\">\n                <div class=\"v-ic\" aria-hidden=\"true\">{{ vGlyph }}<\/div>\n                <div class=\"grow stack g4\">\n                  <div class=\"v-lbl\">ผลการวิเคราะห์ทั้งวิดีโอ<\/div>\n                  <h1 class=\"v-title\">{{ vTitle }}<\/h1>\n                  <p class=\"txt\" style=\"margin-top:2px\">{{ vNote }}<\/p>\n                <\/div>\n                <sc-if value=\"{{ hasConf }}\">\n                  <div class=\"conf\">\n                    <div class=\"small\" style=\"font-weight:500;color:#344054\">ค่าความมั่นใจ<\/div>\n                    <div class=\"row g8\" style=\"align-items:baseline\"><span class=\"conf-v\">{{ confLabel }}<\/span><\/div>\n                    <div class=\"meter\"><i style=\"{{ confBar }}\"><\/i><\/div>\n                    <div class=\"tiny\">ระดับความมั่นใจของระบบต่อผลนี้ ไม่ใช่โอกาสที่ผลจะถูกต้อง<\/div>\n                  <\/div>\n                <\/sc-if>\n              <\/div>\n              <div class=\"v-note\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex:none;margin-top:2px;color:#5b6576\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 8v5M12 16h.01\"><\/path><\/svg>\n                <span>ผลการวิเคราะห์เป็นการประเมินจากระบบเพื่อใช้เป็นข้อมูลประกอบการตัดสินใจ ไม่ใช่การยืนยันความแท้ของวิดีโออย่างสมบูรณ์<\/span>\n              <\/div>\n            <\/section>\n\n            <!-- unable: why + one obvious action -->\n            <sc-if value=\"{{ isUnable }}\">\n              <section class=\"card stack g4\">\n                <h2 class=\"sec-t\">สาเหตุที่ไม่สามารถวิเคราะห์ได้<\/h2>\n                <p class=\"small\" style=\"margin-bottom:6px\">{{ unableIntro }}<\/p>\n                <sc-for list=\"{{ reasons }}\" as=\"r\">\n                  <div class=\"reason\">\n                    <span class=\"reason-n\">{{ r.n }}<\/span>\n                    <div class=\"grow\"><div style=\"font-size:13.5px;font-weight:600;line-height:1.45\">{{ r.t }}<\/div><div class=\"small\">{{ r.d }}<\/div><\/div>\n                  <\/div>\n                <\/sc-for>\n                <div class=\"alert alert-info\" style=\"margin-top:8px\">\n                  <div class=\"grow\">แนะนำให้ใช้วิดีโอที่ใบหน้าหันเข้าหากล้องชัดเจน แสงเพียงพอ กล้องไม่สั่นไหวมาก และมีใบหน้าปรากฏต่อเนื่อง<\/div>\n                <\/div>\n                <div class=\"row g12 wrap\" style=\"margin-top:10px\">\n                  <button class=\"btn btn-pri btn-block-sm\" sc-camel-on-click=\"{{ newVideo }}\">เลือกวิดีโอใหม่<\/button>\n                <\/div>\n              <\/section>\n            <\/sc-if>\n\n            <!-- 3: what was analyzed -->\n            <section class=\"card stack g12\">\n              <div class=\"row between g8 wrap\">\n                <h2 class=\"sec-t\">ข้อมูลที่ใช้วิเคราะห์<\/h2>\n                <span class=\"tiny\">สุ่ม 32 เฟรมกระจายตลอดความยาววิดีโอ<\/span>\n              <\/div>\n              <div class=\"stats\">\n                <sc-for list=\"{{ stats }}\" as=\"s\">\n                  <div class=\"stat\"><span class=\"stat-k\">{{ s.k }}<\/span><span class=\"stat-v\">{{ s.v }}<\/span><span class=\"stat-s\">{{ s.s }}<\/span><\/div>\n                <\/sc-for>\n              <\/div>\n              <p class=\"small\">ระบบไม่ได้ประเมินจากภาพเดียว แต่นำภาพใบหน้าจากหลายเฟรมเรียงตามเวลาเข้าแบบจำลอง แล้วให้ผลลัพธ์เป็นค่าเดียวสำหรับทั้งวิดีโอ<\/p>\n            <\/section>\n\n            <!-- 4: where to look -->\n            <section class=\"card stack g16\">\n              <div class=\"stack g4\">\n                <h2 class=\"sec-t\">{{ reviewTitle }}<\/h2>\n                <p class=\"small\">{{ reviewIntro }}<\/p>\n              <\/div>\n\n              <sc-if value=\"{{ hasRanges }}\">\n                <div class=\"ranges\">\n                  <sc-for list=\"{{ ranges }}\" as=\"r\">\n                    <button class=\"{{ r.cls }}\" sc-camel-on-click=\"{{ r.open }}\" aria-label=\"{{ r.aria }}\">\n                      <span class=\"range-t\">{{ r.label }}<\/span>\n                      <span class=\"stack\"><span style=\"font-size:12.5px;font-weight:600;color:#344054\">{{ r.face }} · ระดับ{{ r.level }}<\/span><span class=\"tiny\">คลิกเพื่อดูเฟรมในช่วงนี้<\/span><\/span>\n                    <\/button>\n                  <\/sc-for>\n                <\/div>\n              <\/sc-if>\n              <sc-if value=\"{{ hasLook }}\">\n                <div class=\"alert alert-neu\">\n                  <div class=\"grow stack g4\">\n                    <b style=\"font-size:13px\">สิ่งที่ควรสังเกตเมื่อเปิดดูช่วงเวลานี้<\/b>\n                    <ul class=\"ul\"><sc-for list=\"{{ lookTips }}\" as=\"t\"><li>{{ t }}<\/li><\/sc-for><\/ul>\n                    <span class=\"tiny\">Deepfake ในปัจจุบันอาจดูสมจริงมาก ร่องรอยเหล่านี้มักเล็กน้อยและอาจไม่เห็นในทุกเฟรม<\/span>\n                  <\/div>\n                <\/div>\n              <\/sc-if>\n              <sc-if value=\"{{ noRangesNote }}\">\n                <div class=\"alert alert-neu\"><div class=\"grow\">{{ noRangesNote }}<\/div><\/div>\n              <\/sc-if>\n\n              <div class=\"tl\" role=\"group\" aria-label=\"ไทม์ไลน์ 32 เฟรมที่สุ่มตรวจ\">\n                <sc-for list=\"{{ tlRows }}\" as=\"row\">\n                  <div class=\"tl-row\">\n                    <span class=\"tl-lbl\">{{ row.label }}<\/span>\n                    <div class=\"{{ row.cls }}\">\n                      <sc-for list=\"{{ row.hl }}\" as=\"h\"><div class=\"tl-hl\" style=\"{{ h.style }}\"><\/div><\/sc-for>\n                      <sc-for list=\"{{ row.bars }}\" as=\"b\">\n                        <sc-if value=\"{{ b.btn }}\"><button class=\"{{ b.cls }}\" style=\"{{ b.style }}\" title=\"{{ b.tip }}\" aria-label=\"{{ b.tip }}\" sc-camel-on-click=\"{{ b.open }}\"><\/button><\/sc-if>\n                        <sc-if value=\"{{ !b.btn }}\"><div class=\"{{ b.cls }}\" style=\"{{ b.style }}\" title=\"{{ b.tip }}\"><\/div><\/sc-if>\n                      <\/sc-for>\n                    <\/div>\n                  <\/div>\n                <\/sc-for>\n                <div class=\"tl-axis\"><span><\/span><div><sc-for list=\"{{ axis }}\" as=\"a\"><span>{{ a }}<\/span><\/sc-for><\/div><\/div>\n              <\/div>\n              <div class=\"legend\">\n                <sc-for list=\"{{ legend }}\" as=\"l\"><span><i style=\"{{ l.style }}\"><\/i>{{ l.t }}<\/span><\/sc-for>\n              <\/div>\n\n              <div class=\"divider\"><\/div>\n              <div class=\"row between g8 wrap\">\n                <h3 class=\"sec-t\" style=\"font-size:14px\">เฟรมตัวอย่างตามลำดับเวลา<\/h3>\n                <span class=\"tiny\">คลิกเพื่อขยาย<\/span>\n              <\/div>\n              <div class=\"frames\">\n                <sc-for list=\"{{ frames }}\" as=\"f\">\n                  <button class=\"{{ f.cls }}\" sc-camel-on-click=\"{{ f.open }}\" aria-label=\"{{ f.aria }}\">\n                    <div class=\"frame sm\">\n                      <img sc-camel-src=\"{{ f.img }}\" alt=\"\">\n                      <sc-for list=\"{{ f.boxes }}\" as=\"b\"><div class=\"{{ b.cls }}\" style=\"{{ b.style }}\"><span class=\"fbox-l\">{{ b.label }}<\/span><\/div><\/sc-for>\n                      <sc-if value=\"{{ f.qBad }}\"><span class=\"chip-dark\" style=\"right:6px;bottom:6px\">{{ f.qShort }}<\/span><\/sc-if>\n                    <\/div>\n                    <div class=\"fr-b\">\n                      <div class=\"fr-m\"><span>#{{ f.no }}<\/span><span>{{ f.time }}<\/span><\/div>\n                      <div class=\"scs\"><sc-for list=\"{{ f.chips }}\" as=\"c\"><span class=\"{{ c.cls }}\">{{ c.t }}<\/span><\/sc-for><\/div>\n                    <\/div>\n                  <\/button>\n                <\/sc-for>\n              <\/div>\n              <p class=\"tiny\">{{ scoreCaveat }}<\/p>\n            <\/section>\n          <\/div>\n\n          <aside class=\"aside\">\n            <section class=\"card stack g12\">\n              <h2 class=\"sec-t\">ใบหน้าที่ตรวจพบ ({{ faceCount }})<\/h2>\n              <sc-if value=\"{{ noFaces }}\"><p class=\"small\">ไม่พบใบหน้าในเฟรมที่สุ่มตรวจ<\/p><\/sc-if>\n              <sc-for list=\"{{ faces }}\" as=\"f\">\n                <div class=\"face\">\n                  <div class=\"crop\"><img sc-camel-src=\"{{ f.img }}\" alt=\"{{ f.name }}\" style=\"{{ f.imgStyle }}\"><\/div>\n                  <div class=\"stack g4 minw0\">\n                    <span style=\"font:600 13px/1.2 'IBM Plex Mono',monospace\">{{ f.name }}<\/span>\n                    <span style=\"font-size:13px;font-weight:500;line-height:1.4\">{{ f.usable }}<\/span>\n                    <span class=\"tiny\">{{ f.sub }}<\/span>\n                  <\/div>\n                <\/div>\n              <\/sc-for>\n              <p class=\"tiny\">ระบบตรวจทุกใบหน้าโดยไม่ต้องเลือกใบหน้าหลัก ผลการประเมินเป็นระดับวิดีโอ ไม่ใช่การระบุตัวบุคคล<\/p>\n            <\/section>\n            <section class=\"card stack g10\">\n              <h2 class=\"sec-t\">คุณภาพภาพใบหน้า<\/h2>\n              <div class=\"tiny\">ผลการคัดกรองก่อนเข้าแบบจำลอง (32 เฟรม)<\/div>\n              <div class=\"qbar\"><sc-for list=\"{{ qualityBar }}\" as=\"q\"><div style=\"{{ q }}\"><\/div><\/sc-for><\/div>\n              <div class=\"stack\">\n                <sc-for list=\"{{ qualityRows }}\" as=\"q\"><div class=\"kv\"><span class=\"row g8\"><i class=\"dot\" style=\"{{ q.dot }}\"><\/i>{{ q.label }}<\/span><span class=\"mono\">{{ q.n }}<\/span><\/div><\/sc-for>\n              <\/div>\n            <\/section>\n            <section class=\"card stack g6\">\n              <h2 class=\"sec-t\">รายละเอียดไฟล์<\/h2>\n              <div class=\"stack\">\n                <sc-for list=\"{{ fileRows }}\" as=\"r\"><div class=\"kv\"><span>{{ r.k }}<\/span><span>{{ r.v }}<\/span><\/div><\/sc-for>\n              <\/div>\n            <\/section>\n            <section class=\"card stack g10\">\n              <h2 class=\"sec-t\">ข้อจำกัดของระบบ<\/h2>\n              <ul class=\"ul\"><sc-for list=\"{{ limits }}\" as=\"l\"><li>{{ l }}<\/li><\/sc-for><\/ul>\n            <\/section>\n          <\/aside>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n\n    <!-- ================= NEAR REAL-TIME ================= -->\n    <sc-if value=\"{{ isRealtime }}\">\n      <div class=\"stack g20 fade\">\n        <div class=\"stack g8\">\n          <h1 class=\"h1\">วิเคราะห์แบบ Near Real-time<\/h1>\n          <p class=\"lead\">ระบบประเมินภาพจากกล้องหรือหน้าจอที่แชร์เป็นช่วงเวลาสั้น ๆ ต่อเนื่องกัน แต่ละผลเป็นการประเมินของช่วงภาพล่าสุด ไม่ใช่การตัดสินจากภาพเดียว และผลอาจช้ากว่าภาพจริงเล็กน้อย<\/p>\n        <\/div>\n\n        <sc-if value=\"{{ rtIdle }}\">\n          <div class=\"srcs\">\n            <button class=\"src\" sc-camel-on-click=\"{{ openWebcam }}\">\n              <div class=\"mode-ic none\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"6\" width=\"13\" height=\"12\" rx=\"2\"><\/rect><path d=\"m16 10 5-3v10l-5-3\"><\/path><\/svg><\/div>\n              <div class=\"stack g4\"><span class=\"mode-t\">กล้อง Webcam<\/span><span class=\"small\">วิเคราะห์ใบหน้าที่อยู่หน้ากล้อง เบราว์เซอร์จะขออนุญาตใช้กล้องก่อนเริ่ม<\/span><span style=\"font-size:13px;font-weight:600;color:#1f5fd8;margin-top:6px\">ถัดไป →<\/span><\/div>\n            <\/button>\n            <button class=\"src\" sc-camel-on-click=\"{{ openScreen }}\">\n              <div class=\"mode-ic none\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"2\"><\/rect><path d=\"M8 20h8M12 16v4\"><\/path><\/svg><\/div>\n              <div class=\"stack g4\"><span class=\"mode-t\">แชร์หน้าจอ / หน้าต่างวิดีโอ<\/span><span class=\"small\">เลือกหน้าต่างวิดีโอคอลหรือแท็บที่เล่นวิดีโอ ระบบวิเคราะห์เฉพาะภาพในพื้นที่ที่แชร์<\/span><span style=\"font-size:13px;font-weight:600;color:#1f5fd8;margin-top:6px\">ถัดไป →<\/span><\/div>\n            <\/button>\n          <\/div>\n          <p class=\"small\">ภาพจากกล้องหรือหน้าจอจะถูกประมวลผลเพื่อการวิเคราะห์ Deepfake เท่านั้น ระบบไม่บันทึกวิดีโอและไม่วิเคราะห์เสียง<\/p>\n        <\/sc-if>\n\n        <sc-if value=\"{{ rtSetup }}\">\n          <div class=\"layout\">\n            <section class=\"card stack g16\">\n              <sc-if value=\"{{ setupError }}\">\n                <div class=\"alert alert-warn\" role=\"alert\"><div class=\"grow\">{{ setupError }}<\/div><\/div>\n              <\/sc-if>\n              <div class=\"row g12 start\">\n                <div class=\"mode-ic none\" style=\"background:#e9effc;color:#1f5fd8\">\n                  <sc-if value=\"{{ rtIsWebcam }}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"6\" width=\"13\" height=\"12\" rx=\"2\"><\/rect><path d=\"m16 10 5-3v10l-5-3\"><\/path><\/svg><\/sc-if>\n                  <sc-if value=\"{{ !rtIsWebcam }}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"2\"><\/rect><path d=\"M8 20h8M12 16v4\"><\/path><\/svg><\/sc-if>\n                <\/div>\n                <div class=\"stack g4 grow\">\n                  <h2 class=\"h2\">{{ setupTitle }}<\/h2>\n                  <p class=\"small\">{{ setupIntro }}<\/p>\n                <\/div>\n              <\/div>\n              <ol class=\"stack g10\">\n                <sc-for list=\"{{ setupSteps }}\" as=\"s\">\n                  <li class=\"row start g12\"><span class=\"how-n\" style=\"background:#eef0f4;color:#344054\">{{ s.n }}<\/span><span class=\"txt\" style=\"padding-top:2px\">{{ s.t }}<\/span><\/li>\n                <\/sc-for>\n              <\/ol>\n              <div class=\"row g8 wrap\">\n                <button class=\"btn btn-pri btn-lg btn-block-sm\" sc-camel-on-click=\"{{ rtConnect }}\" disabled=\"{{ rtConnecting }}\">\n                  <sc-if value=\"{{ rtConnecting }}\"><span class=\"spin\"><\/span><\/sc-if>{{ setupCta }}\n                <\/button>\n                <button class=\"btn btn-ghost btn-block-sm\" sc-camel-on-click=\"{{ rtBack }}\">ย้อนกลับ<\/button>\n              <\/div>\n            <\/section>\n            <aside class=\"aside\">\n              <section class=\"card stack g10\">\n                <h2 class=\"sec-t\">ความเป็นส่วนตัว<\/h2>\n                <ul class=\"ul\"><sc-for list=\"{{ privacy }}\" as=\"p\"><li>{{ p }}<\/li><\/sc-for><\/ul>\n              <\/section>\n            <\/aside>\n          <\/div>\n        <\/sc-if>\n\n        <sc-if value=\"{{ rtLive }}\">\n          <div class=\"layout\">\n            <div class=\"stack g12 minw0\">\n              <sc-if value=\"{{ rtError }}\">\n                <div class=\"alert alert-warn\" role=\"alert\">\n                  <div class=\"grow\">{{ rtError }}<\/div>\n                  <button class=\"btn btn-sec btn-sm\" sc-camel-on-click=\"{{ rtRetry }}\">ลองอีกครั้ง<\/button>\n                <\/div>\n              <\/sc-if>\n              <div class=\"row between g8 wrap\">\n                <div class=\"stack minw0\">\n                  <h2 class=\"sec-t\">{{ rtHeading }}<\/h2>\n                  <span class=\"tiny\" style=\"overflow-wrap:anywhere\">{{ rtSubheading }}<\/span>\n                <\/div>\n              <\/div>\n              <sc-if value=\"{{ rtDemoNote }}\">\n                <div class=\"alert alert-neu\"><div class=\"grow\">{{ rtDemoNote }}<\/div><\/div>\n              <\/sc-if>\n              <div class=\"live\">\n                <sc-if value=\"{{ rtHasStream }}\"><video ref=\"{{ rtVideoRef }}\" class=\"{{ rtVideoClass }}\" sc-camel-auto-play=\"{{ true }}\" sc-camel-plays-inline=\"{{ true }}\" muted=\"{{ true }}\"><\/video><\/sc-if>\n                <sc-if value=\"{{ !rtHasStream }}\">\n                  <div class=\"frame\">\n                    <div class=\"mov drift\">\n                      <img sc-camel-src=\"{{ rtDemoImg }}\" alt=\"{{ rtDemoAlt }}\">\n                      <sc-for list=\"{{ rtBoxes }}\" as=\"b\"><div class=\"{{ b.cls }}\" style=\"{{ b.style }}\"><span class=\"fbox-l\">{{ b.label }}<\/span><\/div><\/sc-for>\n                    <\/div>\n                  <\/div>\n                <\/sc-if>\n                <sc-if value=\"{{ rtShowGuide }}\"><div class=\"guide\"><\/div><\/sc-if>\n                <sc-if value=\"{{ rtShowArea }}\"><div class=\"area\"><\/div><\/sc-if>\n                <div class=\"live-top\">\n                  <span class=\"{{ rtChipClass }}\"><i><\/i>{{ rtStatus }}<\/span>\n                  <span class=\"chip-dark\" style=\"position:static\">{{ rtElapsedLabel }}<\/span>\n                <\/div>\n                <div class=\"live-bot\">\n                  <span class=\"chip-dark\" style=\"position:static;max-width:70%;overflow:hidden;text-overflow:ellipsis\">{{ rtSourceLabel }}<\/span>\n                  <span class=\"chip-dark\" style=\"position:static\">ใบหน้า {{ rtFaces }}<\/span>\n                <\/div>\n              <\/div>\n              <div class=\"row between g8 wrap\">\n                <div class=\"row g8 wrap\">\n                  <sc-if value=\"{{ !rtRunning }}\"><button class=\"btn btn-pri btn-block-sm\" sc-camel-on-click=\"{{ rtStart }}\">{{ rtStartLabel }}<\/button><\/sc-if>\n                  <sc-if value=\"{{ rtRunning }}\"><button class=\"btn btn-stop btn-block-sm\" sc-camel-on-click=\"{{ rtStop }}\"><span style=\"width:10px;height:10px;background:currentColor;border-radius:2px;display:inline-block\"><\/span>หยุดวิเคราะห์<\/button><\/sc-if>\n                <\/div>\n                <button class=\"btn btn-sec btn-block-sm\" sc-camel-on-click=\"{{ rtExit }}\">{{ rtExitLabel }}<\/button>\n              <\/div>\n              <p class=\"small\">{{ rtHelp }}<\/p>\n              <p class=\"tiny\">ภาพใช้เพื่อการวิเคราะห์ในขณะนี้เท่านั้น ระบบไม่บันทึกวิดีโอ และไม่วิเคราะห์เสียง<\/p>\n            <\/div>\n\n            <aside class=\"aside\">\n              <section class=\"{{ rtVClass }}\" aria-live=\"polite\">\n                <div class=\"row between g8\"><span class=\"small\" style=\"font-weight:500\">ผลประเมินช่วงล่าสุด<\/span><span class=\"mono tiny\">{{ rtWindow }}<\/span><\/div>\n                <div class=\"rt-v\">{{ rtVerdict }}<\/div>\n                <div class=\"row between g8\"><span class=\"small\">ค่าความมั่นใจ<\/span><spa
